<!DOCTYPE html>
<html>
<head>
        <meta charset="utf-8" />
        <title>Sixty Four</title>
        <link rel="manifest" href="/manifest.json">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
        <link rel="stylesheet" href="./font/montserrat.css" type="text/css" charset="utf-8" />
        <style>
        	.loading {
	            position: absolute;
	            top: 50%;
	            left: 50%;
	            transform: translate(-50%, -50%);
	            font: 400 2em 'Montserrat';
	            letter-spacing: .6em;
	            animation: loadingSpin .9s linear infinite;
	        }
        	@keyframes loadingSpin {
        		0% {transform: translate(-50%, -50%) rotate(0deg)}
        		100% {transform: translate(-50%, -50%) rotate(360deg)}
        	}
        </style>
        <script type="text/javascript" src="scripts/game.js?v=10"></script>
        <script type="text/javascript" src="modloader/loader.js?v=1"></script>
</head>

<body>
<div class="loading"><nobr>SIXTY FOUR</nobr></div>
<canvas class="canvas"></canvas>
<!-- <div class="shop"></div> -->
<div class="store"></div>
<script>
	var DEBUG
	var Playsaurus
</script>
<script type="module">

try {
	Playsaurus = require('@playsaurus-inc/sdk')
	Playsaurus.initialize({
		gameSlug: `sixty-four`,
		endpoint: `https://staging.playsaurus.com/api`,
		gameVersion: `1.0.0`,
		gamePlatform: Playsaurus.GamePlatform.Web,
		gameStorefront: Playsaurus.GameStorefront.PlaysaurusWeb,
		gameFlavor: `default`,
		locale: 'en-US',
	})
} catch(e){
	console.log(e)
}

let game
window.onload = _=>{
	try {
		const spaceport = require(`electron`).ipcRenderer
		if (spaceport){
			window.onerror = (ev, so, li, co, er)=>{
				spaceport.send(`gameError`, er)
			}
			spaceport.on(`console`, (e,d)=>{
				console.log(d)
			})
			spaceport.on(`hereYouGoSir`, (e,d)=>{
				stopSpinning()
				game = new Game(document.querySelector(`.canvas`), d)
				DEBUG = game
			})
			spaceport.send(`getMyStuff`, `please`)
		}
	} catch (e){
		console.log(`hey`)
		stopSpinning()
		game = new Game(document.querySelector(`.canvas`))
		DEBUG = game
	}
}
function stopSpinning(){
	document.querySelector(`.loading`)?.remove()
}

</script>
</body>
</html>
