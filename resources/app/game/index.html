<body>

<canvas class="canvas"></canvas>
<div class="shop"></div>
<script type="text/javascript">

        let game
        window.onload = _=>{
                try {
                        const spaceport = require(`electron`).ipcRenderer
                        if (spaceport){
                                window.onerror = (ev, so, li, co, er)=>{
                                        spaceport.send(`gameError`, er)
                                }
                                spaceport.on(`hereYouGoSir`, (e,d)=>{
                                        game = new Game(document.querySelector(`.canvas`), d)
                                })
                                spaceport.send(`getMyStuff`, `please`)
                        }
                } catch (e){
                        game = new Game(document.querySelector(`.canvas`))
                }
        }

</script>
